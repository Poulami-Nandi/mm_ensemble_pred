[project]
name = "mm-ensemble"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.23",
  "matplotlib>=3.7",
  "xgboost>=1.7",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "pmdarima>=2.0",
  "pytrends>=4.9.2",
  "yfinance>=0.2.35",
  "requests>=2.31",
  "pyarrow>=14.0",
  "joblib>=1.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mm-train = "mm_ensemble.trainer:main"
mm-last5 = "mm_ensemble.last5_ensemble_plots:main"
